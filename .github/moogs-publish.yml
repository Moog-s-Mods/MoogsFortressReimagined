# v2 publish manifest - Moog-s-Mods/MoogsFortressReimagined
# Lives on the DEFAULT branch (1.21-datapack) only; every publish branch reads it from here.
# Schema per release-actions docs/v2-contracts.md.
#
# TODO: NOT ONBOARDED YET. The CurseForge and Modrinth pages do not exist, so every project id,
# slug and image url below is blank. Fill them in (moogs-publish-onboard skill) before the
# first tagged release. Do not copy ids from another mod. The Structure Lib dependency is the
# library's own page, not an MNS id, so it stays.
schema: 1
mod:
  id: mfr
  displayName: "Moog's Fortress Reimagined"
  environments: [Server]   # TODO: confirm once the CurseForge page exists
  name: MoogsFortressReimagined
  validate: true
platforms:
  curseforge: { projectId: "", slug: "" }   # TODO: CurseForge project id and slug
  modrinth:   { projectId: "", slug: "" }   # TODO: Modrinth project id and slug
discord:
  embedColor: "#c20045"
  avatarUrl: ""      # TODO: MFR avatar
  bannerUrl: ""      # TODO: MFR banner
  thumbnailUrl: ""   # TODO: MFR thumbnail (square 64px)
  pingDefault: false
# TODO: confirm dependency ids for the MFR pages (Moog's Structure Lib is required).
dependencies:
  - { modrinth: 1oUDhxuy, curseforge: moogs-structure-lib, type: required }
artifacts:
  - type: universal-jar
  # TODO: add a config-pack artifact with its own CurseForge project once one exists.
targets:
  - branch: 1.20-datapack
    mc: { start: "1.20", end: "1.20.6" }
    java: 21
    displaySuffix: "[UNIVERSAL]"
  - branch: 1.21-datapack
    mc: { start: "1.21", end: "26.3" }   # fleet standard for universal 1.21 targets
    java: 21
    displaySuffix: "[UNIVERSAL]"
