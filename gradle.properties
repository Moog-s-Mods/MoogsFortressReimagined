# Build inputs only. Everything the publish pipeline needs (project ids, MC windows,
# display names, Discord styling, dependencies) lives in .github/moogs-publish.yml on the
# repository's default branch. Keys are snake_case fleet-wide.
org.gradle.jvmargs=-Xmx2G

# Project
mod_id=mfr
mod_name=MoogsFortressReimagined
mod_version=1.0.0
mod_description=A reimagined nether fortress that comes intact, damaged or ruined. The more ruin, the tougher the fight and the better the loot.

# Minecraft
minecraft_version=1.21

# Metadata links expanded into fabric.mod.json / quilt.mod.json / mods.toml / pack.mcmeta
mod_homepage=https://github.com/Moog-s-Mods/MoogsFortressReimagined
mod_sources=https://github.com/Moog-s-Mods/MoogsFortressReimagined
mod_releases=https://github.com/Moog-s-Mods/MoogsFortressReimagined/releases
mod_issues=https://github.com/Moog-s-Mods/MoogsFortressReimagined/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
# TODO: set once the CurseForge page exists
mod_curseforge=
# TODO: set once the Modrinth page exists
mod_modrinth=

# Structure Lib dependency range (forge/neoforge mods.toml)
structure_lib_version_range=[4.0.0,)
